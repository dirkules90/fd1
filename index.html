<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sprachboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <header class="header">
      <div class="logo">
        <span class="logo-icon">🎙</span>
        <span class="logo-text">Sprachboard</span>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <main class="main">

      <!-- TTS Input -->
      <section class="card tts-card">
        <label class="card-label">Text eingeben & sprechen lassen</label>
        <textarea
          id="ttsInput"
          class="tts-textarea"
          placeholder="Was soll gesprochen werden?"
          rows="3"
        ></textarea>
        <button class="btn-speak" id="speakBtn">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span id="speakBtnLabel">Sprechen</span>
        </button>
      </section>

      <!-- Pre-made Clips -->
      <section class="clips-section">
        <h2 class="section-title">Schnellzugriff</h2>
        <div class="clips-grid" id="clipsGrid"></div>
      </section>

    </main>
  </div>

  <!-- Settings Panel -->
  <div class="overlay" id="overlay"></div>
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-header">
      <h2>Einstellungen</h2>
      <button class="icon-btn" id="closeSettingsBtn" aria-label="Schließen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="form-group">
        <label class="form-label">ElevenLabs API Key</label>
        <input type="password" id="apiKeyInput" class="form-input" placeholder="Deinen API Key hier eingeben" autocomplete="off">
        <p class="form-hint">Zu finden unter elevenlabs.io → Profil → API Key</p>
      </div>
      <div class="form-group">
        <label class="form-label">Voice ID</label>
        <input type="text" id="voiceIdInput" class="form-input" placeholder="z.B. 21m00Tcm4TlvDq8ikWAM" autocomplete="off">
        <p class="form-hint">Zu finden in ElevenLabs → Voices → deine Stimme → ID</p>
      </div>
      <button class="btn-save" id="saveSettingsBtn">Speichern</button>
      <div class="status-dot-wrap" id="settingsStatus"></div>
    </div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
