<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alex – Soundboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- Verhindert Flackern bei bereits eingeloggten Nutzern -->
  <script>if(localStorage.getItem('sb_auth')==='1'){document.documentElement.classList.add('authed');}</script>
</head>
<body>

  <div class="app">

    <!-- Settings button top right -->
    <!-- AUSKOMMENTIERT – bei Bedarf wieder einkommentieren für ElevenLabs TTS
    <button class="settings-fab" id="settingsBtn" aria-label="Einstellungen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    -->

    <main class="main">

      <!-- Hero -->
      <section class="hero">
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar-ring"></div>
          <img src="audio/alex.png" alt="Alex" class="avatar-img" id="avatarImg">
        </div>
        <h1 class="hero-name" id="heroName">Alex</h1>
        <p class="hero-sub">Soundboard</p>
      </section>

      <!-- Clip buttons -->
      <section class="clips-section">
        <div id="clipsGrid"></div>
      </section>

      <!-- TTS (optional, needs API key) -->
      <!-- AUSKOMMENTIERT – bei Bedarf wieder einkommentieren für ElevenLabs TTS
      <section class="tts-section" id="ttsSection">
        <details class="tts-details">
          <summary class="tts-summary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Eigenen Text sprechen lassen
          </summary>
          <div class="tts-body">
            <textarea id="ttsInput" class="tts-textarea" placeholder="Text eingeben…" rows="3"></textarea>
            <button class="btn-speak" id="speakBtn">
              <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span id="speakBtnLabel">Sprechen</span>
            </button>
            <p class="tts-hint">Benötigt ElevenLabs API Key → Einstellungen (⚙)</p>
          </div>
        </details>
      </section>
      -->

    </main>
  </div>

  <!-- Settings Panel -->
  <!-- AUSKOMMENTIERT – bei Bedarf wieder einkommentieren für ElevenLabs TTS
  <div class="overlay" id="overlay"></div>
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-header">
      <h2>Einstellungen</h2>
      <button class="icon-btn" id="closeSettingsBtn" aria-label="Schließen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="settings-body">
      <p class="settings-info">Nur nötig für den "Eigenen Text"-Bereich. Die 8 Buttons funktionieren ohne API Key.</p>
      <div class="form-group">
        <label class="form-label">ElevenLabs API Key</label>
        <input type="password" id="apiKeyInput" class="form-input" placeholder="API Key eingeben" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Voice ID</label>
        <input type="text" id="voiceIdInput" class="form-input" placeholder="z.B. 21m00Tcm4TlvDq8ikWAM" autocomplete="off">
      </div>
      <button class="btn-save" id="saveSettingsBtn">Speichern</button>
      <div class="settings-status" id="settingsStatus"></div>
    </div>
  </aside>
  -->

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <img src="audio/alex.png" alt="Alex" class="lightbox-img" id="lightboxImg">
  </div>

  <!-- Easter Egg Video -->
  <div class="video-overlay" id="videoOverlay">
    <video id="easterEggVideo" playsinline webkit-playsinline>
      <source src="audio/Vettel(1)_cut.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Spezial Mode -->
  <div class="spezial-overlay" id="spezialOverlay">
    <div class="spezial-inner">
      <div class="spezial-header">
        <button class="spezial-back" id="spezialBack">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Zurück
        </button>
        <h2 class="spezial-title">✦ Spezial</h2>
      </div>
      <div class="spezial-grid" id="spezialGrid"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Password Gate -->
  <div class="gate" id="gate">
    <div class="gate-inner">
      <h1 class="gate-title">Ich wünsche euch eine schöne WM!</h1>
      <img src="audio/alex_wm.png" alt="Alex WM" class="gate-img">
      <div class="gate-form">
        <input type="password" id="gateInput" class="gate-input" placeholder="Passwort eingeben …" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="gate-btn" id="gateBtn">Los geht's ›</button>
        <p class="gate-error" id="gateError"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
